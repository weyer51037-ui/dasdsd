name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check project files
        run: |
          if [ ! -f build.gradle ]; then
            echo "::error::build.gradle not found in the repo root. Upload the contents of the vortex-client folder, not the zip or the folder itself."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: vortex-client
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          generate_release_notes: true
